[package]
name = "web-app-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
default-run = "web-app-native"

[lib]
name = "web_app_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "=2.12.2", features = [] }

[features]
default = []
desktop-terminal = ["dep:portable-pty", "dep:serde", "dep:serde_json", "dep:windows-sys", "dep:png", "dep:gif", "dep:base64", "dep:sha2", "dep:image", "dep:resvg", "dep:roxmltree", "dep:zip"]
native-io = ["dep:tauri-plugin-clipboard-manager", "dep:tauri-plugin-dialog"]
native-webdriver = ["dep:tauri-plugin-wdio-webdriver"]

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tauri-plugin-wdio-webdriver = { version = "=1.5.1", optional = true }
portable-pty = { version = "0.9", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
base64 = { version = "0.22", optional = true }
png = { version = "0.18", optional = true }
gif = { version = "=0.14.2", default-features = false, features = ["std"], optional = true }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "webp", "bmp", "ico"], optional = true }
resvg = { version = "=0.47.0", default-features = false, optional = true }
roxmltree = { version = "=0.21.2", optional = true }
zip = { version = "=9.8.2", default-features = false, optional = true }
tauri-plugin-clipboard-manager = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
sha2 = { version = "0.10", optional = true }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO"], optional = true }

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[patch.crates-io]
portable-pty = { path = "vendor/portable-pty" }
