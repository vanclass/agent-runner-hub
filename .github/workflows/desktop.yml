name: Desktop checks and local packages
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            build: macos-tauri
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            build: macos-tauri
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Execute native macOS containment feasibility fixtures
        if: runner.os == 'macOS'
        run: python3 tests/native/macos_containment.py temp/macos-containment-${{ matrix.target }}
      - name: Retain native containment evidence, including failed experiments
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: macos-containment-${{ matrix.target }}
          path: temp/macos-containment-${{ matrix.target }}/
          if-no-files-found: error
