name: Desktop checks and local packages
on:
  push:
permissions:
  contents: read
  actions: write
jobs:
  desktop:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Cancel only the superseded Task 4 fixture run
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $null = Get-Command gh -ErrorAction Stop
          $prior = gh api repos/vanclass/agent-runner-hub/actions/runs/40104735986 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect owned validation run' }
          if ($prior.head_sha -ne 'c04ec6148ad9b78cb94541db65c402c57db9faa7') { throw 'Validation identity mismatch' }
          if ($prior.status -ne 'completed') {
            gh api --method POST repos/vanclass/agent-runner-hub/actions/runs/40104735986/cancel
            if ($LASTEXITCODE -ne 0) { throw 'Owned run cancellation failed' }
          }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Check TypeScript and build frontend
        run: npm run build
      - name: Prepare native Rust target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add x86_64-pc-windows-msvc --toolchain stable
      - name: Check and test selected Rust features
        timeout-minutes: 30
        run: node .runner/web-app-tauri/check.mjs
